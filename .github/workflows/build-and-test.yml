name: Android Release APK

on:
  push:
    branches:
      - eoleun
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.5"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias release \
            -storepass screenposter \
            -keypass screenposter \
            -dname "CN=ScreenPoster, OU=Dev, O=whooslizi, L=Unknown, S=Unknown, C=US"

      - name: Test and build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: screenposter
          SIGNING_KEY_ALIAS: release
          SIGNING_KEY_PASSWORD: screenposter
        run: gradle testDebugUnitTest assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: screenposter-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Get version tag
        if: github.event_name != 'pull_request'
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
